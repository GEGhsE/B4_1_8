<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 마음 전달 우체국 — 교사 대시보드</title>
  <style>
    /* 한국어 줄바꿈 — 낱말이 중간에서 끊기지 않게 화면 전체에 겁니다. */
    html, body, body *, body *::before, body *::after {
      word-break: keep-all;
      overflow-wrap: normal;
      word-wrap: normal;
      line-break: strict;
    }
    /* 학생이 쓴 글과 주소는 띄어쓰기 없이 길게 이어질 수 있어
       상자 밖으로 넘치지 않도록 이 자리에서만 끊습니다. */
    textarea, input, .content-box, .letter-content, .pl-content,
    #review-content, .mail-item, #studentLinkText, #teacherLinkText {
      overflow-wrap: anywhere;
    }
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Malgun Gothic', sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      color: #1e293b;
    }

    /* ── 헤더 ── */
    .top-bar {
      background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%);
      color: white;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 16px rgba(124,58,237,0.3);
    }
    .top-bar h1  { font-size: 1.2em; }
    .top-bar .sub { font-size: 0.82em; opacity: 0.8; margin-top: 2px; }
    .refresh-btn {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.4);
      color: white;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9em;
      transition: all 0.2s;
    }
    .refresh-btn:hover { background: rgba(255,255,255,0.35); }

    /* ── 레이아웃 ── */
    .page { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }

    /* ── 요약 카드 ── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .sum-card {
      background: white;
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      border-top: 4px solid #7c3aed;
    }
    .sum-card.orange { border-top-color: #f97316; }
    .sum-card.green  { border-top-color: #22c55e; }
    .sum-card.pink   { border-top-color: #ec4899; }
    .sum-card.yellow { border-top-color: #eab308; }

    .sum-card .label { font-size: 0.78em; color: #64748b; margin-bottom: 6px; }
    .sum-card .value { font-size: 2em; font-weight: bold; color: #1e293b; }
    .sum-card .sub   { font-size: 0.78em; color: #94a3b8; margin-top: 4px; }

    /* ── 필터 바 ── */
    .filter-bar {
      background: white;
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .filter-bar select, .filter-bar input {
      padding: 8px 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9em;
      background: #f8fafc;
    }
    .filter-bar select:focus, .filter-bar input:focus {
      outline: none;
      border-color: #7c3aed;
    }
    .filter-bar label { font-size: 0.85em; color: #64748b; }

    /* ── 차트 섹션 ── */
    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    @media (max-width: 720px) {
      .charts-row { grid-template-columns: 1fr; }
    }
    .chart-card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .chart-card h3 { font-size: 0.95em; color: #475569; margin-bottom: 14px; }

    /* 간단한 바 차트 (CSS) */
    .bar-chart { display: flex; flex-direction: column; gap: 10px; }
    .bar-row { display: flex; align-items: center; gap: 10px; }
    .bar-label { font-size: 0.82em; width: 80px; color: #475569; flex-shrink: 0; }
    .bar-track { flex: 1; background: #f1f5f9; border-radius: 20px; height: 24px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 20px; background: linear-gradient(90deg, #7c3aed, #a855f7); display: flex; align-items: center; padding-left: 8px; font-size: 0.78em; color: white; font-weight: bold; transition: width 0.8s ease; min-width: 24px; }
    .bar-count { font-size: 0.82em; color: #64748b; width: 28px; text-align: right; flex-shrink: 0; }

    /* 점수 분포 */
    .score-bars { display: flex; align-items: flex-end; gap: 8px; height: 120px; padding-top: 10px; }
    .score-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; }
    .score-bar-fill { width: 100%; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, #f093fb, #f5576c); transition: height 0.8s ease; }
    .score-bar-label { font-size: 0.72em; color: #64748b; }
    .score-bar-count { font-size: 0.78em; color: #475569; font-weight: bold; }

    /* ── 데이터 테이블 ── */
    .table-card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      overflow: hidden;
      margin-bottom: 28px;
    }
    .table-card .table-header {
      padding: 16px 20px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .table-card .table-header h3 { font-size: 0.95em; color: #475569; }
    .table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
    th {
      background: #f8fafc;
      padding: 11px 14px;
      text-align: left;
      font-size: 0.8em;
      color: #64748b;
      border-bottom: 1px solid #e2e8f0;
      white-space: nowrap;
    }
    td {
      padding: 11px 14px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #faf5ff; }

    .score-chip {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85em;
    }
    .score-chip.high   { background: #dcfce7; color: #166534; }
    .score-chip.mid    { background: #fef9c3; color: #854d0e; }
    .score-chip.low    { background: #fee2e2; color: #991b1b; }

    .type-chip {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.82em;
      background: #ede9fe;
      color: #5b21b6;
    }
    .mode-chip {
      font-size: 0.8em;
      color: #64748b;
    }

    .view-btn {
      padding: 5px 12px;
      background: #f5f0ff;
      color: #7c3aed;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.82em;
    }
    .view-btn:hover { background: #ede9fe; }

    /* ── 편지 내용 모달 ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: white;
      border-radius: 18px;
      padding: 28px;
      max-width: 560px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .modal h3 { font-size: 1.1em; margin-bottom: 6px; }
    .modal .meta { font-size: 0.82em; color: #888; margin-bottom: 16px; }
    .modal .content-box {
      background: #fef9ec;
      border-radius: 10px;
      padding: 16px;
      line-height: 1.9;
      font-size: 0.95em;
      white-space: pre-wrap;
      margin-bottom: 16px;
    }
    .modal-scores { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .modal-score-item { background: #f8fafc; border-radius: 8px; padding: 8px 14px; font-size: 0.85em; }
    .modal-score-item strong { display: block; font-size: 1.1em; color: #7c3aed; }
    .close-btn {
      width: 100%;
      padding: 12px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 1em;
    }

    /* ── 로딩 / 빈 상태 ── */
    .loading-wrap, .empty-wrap {
      text-align: center;
      padding: 60px 20px;
      color: #94a3b8;
    }
    .loading-wrap .spinner { font-size: 2.5em; animation: spin 1s linear infinite; display: block; margin-bottom: 14px; }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

    /* ── 내보내기 버튼 ── */
    .export-btn {
      padding: 8px 18px;
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85em;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <div>
    <h1>📊 마음 전달 우체국 — 교사 대시보드</h1>
    <div class="sub" id="lastUpdated">데이터 불러오는 중...</div>
  </div>
  <button class="refresh-btn" onclick="reloadFromServer()">🔄 새로고침</button>
</div>

<div class="page">

  <!-- 요약 카드 -->
  <div class="summary-grid">
    <div class="sum-card">
      <div class="label">총 제출 편지</div>
      <div class="value" id="sumTotal">—</div>
      <div class="sub">전체 누적</div>
    </div>
    <div class="sum-card orange">
      <div class="label">참여 학생 수</div>
      <div class="value" id="sumStudents">—</div>
      <div class="sub">고유 이름 기준</div>
    </div>
    <div class="sum-card green">
      <div class="label">평균 감동 지수</div>
      <div class="value" id="sumAvgScore">—</div>
      <div class="sub">전체 평균</div>
    </div>
    <div class="sum-card pink">
      <div class="label">자유 작성 비율</div>
      <div class="value" id="sumFreeRate">—</div>
      <div class="sub">자유 / 전체</div>
    </div>
    <div class="sum-card yellow">
      <div class="label">오늘 제출</div>
      <div class="value" id="sumToday">—</div>
      <div class="sub">오늘 날짜 기준</div>
    </div>
  </div>

  <!-- 차트 -->
  <div class="charts-row">
    <div class="chart-card">
      <h3>📮 편지 유형별 분포</h3>
      <div class="bar-chart" id="typeChart">
        <div class="empty-wrap" style="padding:20px;">데이터 없음</div>
      </div>
    </div>
    <div class="chart-card">
      <h3>💯 감동 지수 분포</h3>
      <div style="display:flex;align-items:flex-end;gap:6px;height:130px;" id="scoreChart">
        <div class="empty-wrap" style="padding:20px;width:100%;">데이터 없음</div>
      </div>
      <div style="display:flex;gap:6px;margin-top:4px;" id="scoreChartLabels"></div>
    </div>
  </div>

  <!-- 필터 -->
  <div class="filter-bar">
    <label>학생 이름</label>
    <input id="filterName" type="text" placeholder="이름 검색..." oninput="renderTable()">
    <label>편지 유형</label>
    <select id="filterType" onchange="renderTable()">
      <option value="">전체</option>
      <option value="감사 편지">감사 편지</option>
      <option value="축하 편지">축하 편지</option>
      <option value="위로 편지">위로 편지</option>
      <option value="초대 편지">초대 편지</option>
      <option value="사과 편지">사과 편지</option>
    </select>
    <label>작성 모드</label>
    <select id="filterMode" onchange="renderTable()">
      <option value="">전체</option>
      <option value="템플릿">템플릿</option>
      <option value="자유 작성">자유 작성</option>
    </select>
  </div>

  <!-- 교수학적 인사이트 패널 -->
  <div class="table-card" style="margin-bottom:20px;">
    <div class="table-header">
      <h3>💡 수업 인사이트 <span style="color:#94a3b8;font-size:0.85em;font-weight:normal;">— 다음 수업에서 무엇을 가르칠까요?</span></h3>
    </div>
    <div style="padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px;" id="insightPanel">
      <div style="color:#94a3b8;grid-column:1/-1;text-align:center;padding:20px;">데이터를 불러오는 중이에요...</div>
    </div>
  </div>

  <!-- 데이터 테이블 -->
  <div class="table-card">
    <div class="table-header">
      <h3>📋 제출 현황 <span id="tableCount" style="color:#94a3b8;font-weight:normal;font-size:0.9em;"></span></h3>
    </div>
    <div class="table-wrap">
      <div id="tableArea">
        <div class="loading-wrap"><span class="spinner">📮</span>데이터를 불러오는 중이에요...</div>
      </div>
    </div>
  </div>

</div><!-- /page -->

<!-- 편지 내용 모달 -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div class="meta" id="modalMeta"></div>
    <div class="modal-scores" id="modalScores"></div>
    <div class="content-box" id="modalContent"></div>
    <button class="close-btn" onclick="closeModal()">닫기</button>
  </div>
</div>

<script>
  // ══════════════════════════════════════════════════════════
  //  이 화면은 깃허브에 올려 두고, 편지를 담아 둔 시트(웹 앱)와
  //  따로 떨어져 있다. 그래서 주소 뒤에 붙은 정보로
  //  어느 시트에 물어볼지 알아낸다.
  //      teacher.html#c=시트주소
  //  ※ 접속 방식은 학생 화면(student.html)과 똑같다. 고치지 말 것.
  // ══════════════════════════════════════════════════════════
  const _mExec   = (location.hash || '').match(/#c=([^&]+)/);
  const EXEC_URL = _mExec ? decodeURIComponent(_mExec[1]) : '';

  // 연결된 시트로 요청 보내기
  //  화면과 시트는 서로 다른 주소라, 브라우저 보안에 막히지 않는 방식으로 부른다.
  //  보낼 내용이 아주 길 때만 예전 방식으로 보낸다.
  let _reqSeq = 0;
  function requestSheet(baseUrl, fnName, args) {
    const body  = JSON.stringify(args || []);
    const query = 'fn=' + encodeURIComponent(fnName) + '&args=' + encodeURIComponent(body);

    if (query.length > 6000 && typeof fetch === 'function') {
      return fetch(baseUrl, { method: 'POST', body: JSON.stringify({ fn: fnName, args: args || [] }) })
        .then(r => r.json());
    }

    return new Promise(function (resolve, reject) {
      const cb = '_hp_' + Date.now() + '_' + (_reqSeq++);
      let done = false;
      const timer = setTimeout(function () { finish(null, true); }, 20000);

      function finish(res, failed) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        try { delete window[cb]; } catch (e) { window[cb] = undefined; }
        const el = document.getElementById(cb);
        if (el && el.parentNode) el.parentNode.removeChild(el);
        if (failed) reject(new Error('연결에 실패했어요.'));
        else resolve(res);
      }

      window[cb] = function (res) { finish(res, false); };

      const sc = document.createElement('script');
      sc.id  = cb;
      sc.src = baseUrl + (baseUrl.indexOf('?') >= 0 ? '&' : '?') + query +
               '&callback=' + encodeURIComponent(cb) + '&_=' + Date.now();
      sc.async = true;
      sc.onerror = function () { finish(null, true); };
      document.body.appendChild(sc);
    });
  }

  // ── 데이터 ──────────────────────────────────────────────
  let allData = [];
  let headers = [];

  // 열 인덱스 (Code.gs 헤더 순서와 일치)
  // 시트는 열여섯 칸이지만, 이 화면은 앞의 열세 칸만 씁니다.
  // 나머지(편지 ID, 편지지, 보내는 사람)는 편지 보기 화면에서 씁니다.
  const COL = {
    time: 0, name: 1, type: 2, mode: 3,
    recipient: 4, charCount: 5, score: 6,
    wordCount: 7, words: 8,
    sincerity: 9, actions: 10, revision: 11, content: 12
  };

  // ── 학급 자료 가져오기 ──────────────────────────────────
  //   주소에 담긴 시트로 물어본다.
  function fetchClassData(cb) {
    if (!EXEC_URL) {
      cb({ success: false, message: "주소가 올바르지 않아요. 앱 화면의 '선생님 메뉴'에서 대시보드 링크를 다시 받아 주세요." });
      return;
    }
    requestSheet(EXEC_URL, 'getClassData', [])
      .then(function (res) { cb(res); })
      .catch(function (err) {
        console.error('학급 자료 불러오기 실패: ' + err);
        cb({ success: false, message: '자료를 불러오지 못했어요. 잠시 뒤 새로고침을 눌러 주세요.' });
      });
  }

  function loadData() {
    document.getElementById('lastUpdated').textContent = '불러오는 중...';
    fetchClassData(res => {
      try {
        if (!res || !res.success) {
          showError((res && res.message) || '데이터 로드 실패');
          return;
        }
        headers = res.headers || [];
        allData = res.data    || [];
        updateSummary();
        renderCharts();
        renderInsights();
        renderTable();
        document.getElementById('lastUpdated').textContent =
          `마지막 업데이트: ${new Date().toLocaleString('ko-KR')} (${allData.length}건)`;
      } catch(e) {
        showError('렌더링 오류: ' + e.message);
        console.error(e);
      }
    });
  }

  function reloadFromServer() {
    // 새로고침 시 페이지 자체를 다시 로드
    location.reload();
  }

  function showError(msg) {
    document.getElementById('tableArea').innerHTML =
      `<div class="empty-wrap">⚠️ 오류: ${msg}</div>`;
    document.getElementById('lastUpdated').textContent = '불러오기 실패';
  }

  // ── 요약 통계 ──────────────────────────────────────
  function updateSummary() {
    const total    = allData.length;
    const students = new Set(allData.map(r => r[COL.name])).size;
    const avgScore = total
      ? Math.round(allData.reduce((s, r) => s + (Number(r[COL.score]) || 0), 0) / total)
      : 0;
    const freeCount = allData.filter(r => String(r[COL.mode]).includes('자유')).length;
    const freeRate  = total ? Math.round(freeCount / total * 100) : 0;

    const today = new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit' });
    const todayCount = allData.filter(r => String(r[COL.time]).startsWith(today.replace(/\./g, '-').replace(' ', '').slice(0,10))).length;
    // simpler today check: just check if date string includes today's date portion
    const todayStr = new Date().toISOString().slice(0, 10);
    const todayCount2 = allData.filter(r => String(r[COL.time]).startsWith(todayStr)).length;

    document.getElementById('sumTotal').textContent    = total;
    document.getElementById('sumStudents').textContent = students;
    document.getElementById('sumAvgScore').textContent = avgScore + '점';
    document.getElementById('sumFreeRate').textContent = freeRate + '%';
    document.getElementById('sumToday').textContent    = todayCount2;
  }

  // ── 차트 ──────────────────────────────────────────────
  const TYPE_COLORS = {
    '감사 편지': '#7c3aed',
    '축하 편지': '#ec4899',
    '위로 편지': '#3b82f6',
    '초대 편지': '#22c55e',
    '사과 편지': '#f97316',
  };
  const TYPE_LABELS = ['감사 편지','축하 편지','위로 편지','초대 편지','사과 편지'];

  function renderCharts() {
    // 편지 유형 바 차트
    const typeCounts = {};
    TYPE_LABELS.forEach(t => typeCounts[t] = 0);
    allData.forEach(r => { if (typeCounts[r[COL.type]] !== undefined) typeCounts[r[COL.type]]++; });
    const maxType = Math.max(...Object.values(typeCounts), 1);

    document.getElementById('typeChart').innerHTML = TYPE_LABELS.map(t => `
      <div class="bar-row">
        <div class="bar-label">${t.replace(' 편지','')}</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${Math.max(typeCounts[t]/maxType*100,0)}%;background:linear-gradient(90deg,${TYPE_COLORS[t]},${TYPE_COLORS[t]}99)">
            ${typeCounts[t] > 0 ? typeCounts[t] + '통' : ''}
          </div>
        </div>
        <div class="bar-count">${typeCounts[t]}</div>
      </div>
    `).join('');

    // 감동 지수 분포 (50-59, 60-69, 70-79, 80-89, 90-100)
    const BANDS = ['50-59','60-69','70-79','80-89','90+'];
    const bandCounts = [0,0,0,0,0];
    allData.forEach(r => {
      const s = Number(r[COL.score]);
      if (s >= 90) bandCounts[4]++;
      else if (s >= 80) bandCounts[3]++;
      else if (s >= 70) bandCounts[2]++;
      else if (s >= 60) bandCounts[1]++;
      else bandCounts[0]++;
    });
    const maxBand = Math.max(...bandCounts, 1);
    const BAND_COLORS = ['#94a3b8','#60a5fa','#34d399','#fb923c','#f43f5e'];

    document.getElementById('scoreChart').innerHTML = BANDS.map((b, i) => `
      <div class="score-bar-wrap">
        <div class="score-bar-count" style="color:${BAND_COLORS[i]}">${bandCounts[i] || ''}</div>
        <div class="score-bar-fill" style="height:${Math.max(bandCounts[i]/maxBand*100, 4)}%;background:${BAND_COLORS[i]};border-radius:6px 6px 0 0;width:100%;margin-top:auto;"></div>
        <div class="score-bar-label">${b}</div>
      </div>
    `).join('');
  }

  // ── 테이블 렌더링 ──────────────────────────────────
  // ── 교수학적 인사이트 ──────────────────────────────
  const ACTION_LABELS = [
    '받는 사람 얼굴을 떠올렸어요',
    '편지를 처음부터 다시 읽어봤어요',
    '구체적인 일을 기억해서 썼어요',
    '솔직하게 쓰려고 노력했어요',
    '받는 사람이 어떻게 느낄지 생각했어요'
  ];

  function renderInsights() {
    const panel = document.getElementById('insightPanel');
    if (!allData.length) {
      panel.innerHTML = '<div style="color:#94a3b8;grid-column:1/-1;text-align:center;padding:20px;">아직 데이터가 없어요.</div>';
      return;
    }

    // 1. 체크리스트 행동 패턴 분석
    const actionCounts = {};
    ACTION_LABELS.forEach(a => actionCounts[a] = 0);
    let totalWithActions = 0;
    allData.forEach(r => {
      const acts = String(r[COL.actions] || '');
      if (acts && acts !== '(선택 없음)') {
        totalWithActions++;
        ACTION_LABELS.forEach(a => { if (acts.includes(a)) actionCounts[a]++; });
      }
    });
    const leastDone = ACTION_LABELS
      .sort((a, b) => actionCounts[a] - actionCounts[b])[0];
    const leastCount = actionCounts[leastDone];
    const leastPct   = allData.length ? Math.round(leastCount / allData.length * 100) : 0;

    // 2. 고쳐쓰기 분석
    const revisedCount  = allData.filter(r => Number(r[COL.revision] || 0) > 0).length;
    const revisedPct    = allData.length ? Math.round(revisedCount / allData.length * 100) : 0;
    const noRevise      = allData.length - revisedCount;

    // 3. 진심 온도 평균
    const sincList = allData.map(r => Number(r[COL.sincerity])).filter(n => n > 0);
    const sincAvg  = sincList.length ? (sincList.reduce((a,b)=>a+b,0)/sincList.length).toFixed(1) : '—';
    const sincEmoji = sincAvg >= 4 ? '🥰' : sincAvg >= 3 ? '😊' : sincAvg >= 2 ? '🙂' : '😶';

    // 4. 자유 작성 도전 비율
    const freeCount = allData.filter(r => String(r[COL.mode]).includes('자유')).length;
    const freePct   = allData.length ? Math.round(freeCount / allData.length * 100) : 0;

    const insightCard = (icon, title, value, desc, color, suggest) => `
      <div style="background:#f8fafc;border-radius:14px;padding:16px 18px;border-left:4px solid ${color};">
        <div style="font-size:0.78em;color:#64748b;margin-bottom:4px;">${icon} ${title}</div>
        <div style="font-size:1.6em;font-weight:bold;color:#1e293b;margin-bottom:4px;">${value}</div>
        <div style="font-size:0.8em;color:#475569;margin-bottom:8px;">${desc}</div>
        ${suggest ? `<div style="font-size:0.8em;background:white;border-radius:8px;padding:8px 10px;color:#7c3aed;border:1px solid #e2e8f0;">
          💬 <strong>수업 제안:</strong> ${suggest}
        </div>` : ''}
      </div>
    `;

    panel.innerHTML = [
      insightCard('🔲','가장 적게 실천한 행동', `${leastPct}%`,
        `"${leastDone}" — ${leastCount}명만 실천`,
        '#f97316',
        leastPct < 40
          ? `다음 수업에서 "${leastDone}"를 직접 해보는 활동을 넣어보세요.`
          : null),

      insightCard('✏️','고쳐쓰기를 한 학생', `${revisedPct}%`,
        `${revisedCount}명 고쳐씀 / ${noRevise}명 첫 번째 그대로 제출`,
        '#7c3aed',
        noRevise > revisedCount
          ? `고쳐쓰기를 안 한 학생이 더 많아요. "피드백 보고 한 문장만 고치기" 활동을 해보세요.`
          : `절반 이상이 고쳐썼어요! 고쳐쓰기 전후를 비교 공유해보세요.`),

      insightCard('💖','평균 진심 온도', `${sincEmoji} ${sincAvg}`,
        `5점 만점 / ${sincList.length}명 응답`,
        '#ec4899',
        sincAvg < 3
          ? `진심 온도가 낮아요. "이 편지를 받으면 어떤 기분일까?" 역할극을 해보세요.`
          : null),

      insightCard('✏️','자유 작성 도전', `${freePct}%`,
        `${freeCount}명이 자유 작성 선택`,
        '#22c55e',
        freePct < 30
          ? `템플릿 의존도가 높아요. 자유 작성을 먼저 시도하게 격려해보세요.`
          : freePct > 70
          ? `자유 작성 도전자가 많아요! 잘 쓴 자유 작성 편지를 학급과 공유해보세요.`
          : null),
    ].join('');
  }

  function renderTable() {
    const nameFilter = document.getElementById('filterName').value.trim().toLowerCase();
    const typeFilter = document.getElementById('filterType').value;
    const modeFilter = document.getElementById('filterMode').value;

    let filtered = allData.filter(r => {
      if (nameFilter && !String(r[COL.name]).toLowerCase().includes(nameFilter)) return false;
      if (typeFilter && r[COL.type] !== typeFilter) return false;
      if (modeFilter && !String(r[COL.mode]).includes(modeFilter)) return false;
      return true;
    });

    document.getElementById('tableCount').textContent = `(${filtered.length}건)`;

    if (!filtered.length) {
      document.getElementById('tableArea').innerHTML =
        '<div class="empty-wrap">🔍 해당하는 데이터가 없어요.</div>';
      return;
    }

    const scoreChip = s => {
      const n = Number(s);
      const cls = n >= 70 ? 'high' : n >= 50 ? 'mid' : 'low';
      return `<span class="score-chip ${cls}">${s}점</span>`;
    };

    document.getElementById('tableArea').innerHTML = `
      <table>
        <thead>
          <tr>
            <th>제출 시간</th>
            <th>학생 이름</th>
            <th>편지 유형</th>
            <th>작성 모드</th>
            <th>글자 수</th>
            <th>진심 온도</th>
            <th>행동 체크</th>
            <th>고쳐쓰기</th>
            <th>편지 보기</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.map((r, idx) => {
            const sinc = Number(r[COL.sincerity] || 0);
            const sincEmoji = sinc >= 5 ? '💖' : sinc >= 4 ? '🥰' : sinc >= 3 ? '😊' : sinc >= 2 ? '🙂' : sinc >= 1 ? '😶' : '—';
            const rev  = Number(r[COL.revision] || 0);
            const acts = String(r[COL.actions] || '');
            const actCount = acts && acts !== '(선택 없음)'
              ? acts.split(',').filter(Boolean).length : 0;
            return `
            <tr>
              <td style="font-size:0.8em;color:#64748b;">${String(r[COL.time]).slice(0,16)}</td>
              <td><strong>${r[COL.name]}</strong></td>
              <td><span class="type-chip">${r[COL.type]}</span></td>
              <td><span class="mode-chip">${r[COL.mode]}</span></td>
              <td style="text-align:center;">${r[COL.charCount]}자</td>
              <td style="text-align:center;font-size:1.2em;">${sincEmoji}</td>
              <td style="text-align:center;">
                <span style="background:${actCount >= 3 ? '#dcfce7' : actCount >= 1 ? '#fef9c3' : '#fee2e2'};
                  color:${actCount >= 3 ? '#166534' : actCount >= 1 ? '#854d0e' : '#991b1b'};
                  border-radius:12px;padding:2px 10px;font-size:0.82em;font-weight:bold;">
                  ${actCount}가지
                </span>
              </td>
              <td style="text-align:center;">
                ${rev > 0
                  ? `<span style="background:#ede9fe;color:#5b21b6;border-radius:12px;padding:2px 10px;font-size:0.82em;font-weight:bold;">✏️ ${rev}회</span>`
                  : `<span style="color:#94a3b8;font-size:0.82em;">—</span>`}
              </td>
              <td><button class="view-btn" onclick="openModal(${idx})">보기</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    `;

    window._filtered = filtered;
  }

  // ── 편지 내용 모달 (진심 온도·행동·고쳐쓰기 포함) ────
  function openModal(idx) {
    const r = window._filtered[idx];
    const sinc = Number(r[COL.sincerity] || 0);
    const sincLabel = ['','조금','어느 정도','꽤','많이','있는 힘껏'][sinc] || '—';
    const sincEmoji = sinc >= 5 ? '💖' : sinc >= 4 ? '🥰' : sinc >= 3 ? '😊' : sinc >= 2 ? '🙂' : sinc >= 1 ? '😶' : '';
    const rev  = Number(r[COL.revision] || 0);
    const acts = String(r[COL.actions] || '(선택 없음)');

    document.getElementById('modalTitle').textContent =
      `${r[COL.name]}의 ${r[COL.type]}`;
    document.getElementById('modalMeta').textContent =
      `${String(r[COL.time]).slice(0,16)} | 받는 사람: ${r[COL.recipient]} | ${r[COL.mode]}`;
    document.getElementById('modalScores').innerHTML = `
      <div class="modal-score-item">
        <strong>${sincEmoji} ${sincLabel}</strong>진심 온도
      </div>
      <div class="modal-score-item">
        <strong>${r[COL.charCount]}자</strong>글자 수
      </div>
      <div class="modal-score-item">
        <strong>${rev > 0 ? '✏️ ' + rev + '회' : '없음'}</strong>고쳐쓰기
      </div>
      <div class="modal-score-item" style="flex:1;">
        <strong style="font-size:0.82em;font-weight:normal;line-height:1.6;word-break:keep-all;">${acts}</strong>실천한 행동
      </div>
    `;
    document.getElementById('modalContent').textContent = r[COL.content] || '(내용 없음)';
    document.getElementById('modalOverlay').classList.add('show');
  }

  function closeModal(e) {
    if (!e || e.target === document.getElementById('modalOverlay') || e.type !== 'click' || !e.target.classList.contains('modal')) {
      document.getElementById('modalOverlay').classList.remove('show');
    }
  }

  // ── 초기 실행 ──────────────────────────────────────
  loadData();
</script>
</body>
</html>
