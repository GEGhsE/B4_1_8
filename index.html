<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💌 마음 전달 우체국</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Malgun Gothic', sans-serif;
      background: linear-gradient(135deg, #e3f2fd 0%, #fce4ec 100%);
      color: #475569;
      text-align: center;
      padding: 24px;
    }
    .box { max-width: 420px; }
    .icon { font-size: 3em; display: block; margin-bottom: 14px; }
    .title { font-size: 1.2em; font-weight: bold; color: #1e293b; margin-bottom: 10px; }
    .sub { font-size: 0.95em; line-height: 1.7; }
    a {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 24px;
      background: #7c3aed;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-size: 1em;
    }
  </style>
</head>
<body>

<div class="box">
  <span class="icon">💌</span>
  <div class="title">마음 전달 우체국</div>
  <div class="sub">편지 쓰는 화면으로 옮기고 있어요.<br>잠시만 기다려 주세요.</div>
  <a id="goLink" href="student.html">바로 가기</a>
</div>

<script>
  // 주소 뒤에 붙은 정보(#c=... 등)를 그대로 넘겨 준다.
  // 그래야 선생님이 폴더 주소로 링크를 만들어도 시트 연결이 유지된다.
  (function () {
    var target = 'student.html' + (location.search || '') + (location.hash || '');
    var link = document.getElementById('goLink');
    if (link) link.setAttribute('href', target);
    location.replace(target);
  })();
</script>

</body>
